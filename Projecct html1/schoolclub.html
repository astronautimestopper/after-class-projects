<!DOCTYPE html>
<html>

<head>
    <title>School Club Website</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- STEP 1 - Bootstrap CSS link -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #0bc48c;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #4e1bc7;
        }

        .club-card {
            text-align: center;
            border: 2px solid #0a79c4;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #0ddfd4;
        }

        .club-card h3 {
            color: #FF5A43;
        }
    </style>
</head>

<body>

    <h1>My School Clubs</h1>

   
    <div class="container">

        
        <div class="row">

           
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Coding Club</h3>
                    <p>I learn how to create websites, games, and simple apps.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Football Club</h3>
                    <p>I enjoy practicing my shhoting, dribbling, passing, and defending skills.</p>
                </div>
            </div>

            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h3>Debate Club</h3>
                    <p>It is interesting to talk and show different perspectives on the same topics.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- STEP 5 - Bootstrap JS script -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>

</body>

</html>
