<!DOCTYPE html>
<html>

<head>
    <title>My Daily Task Organizer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: rgb(7, 7, 211);
        }

        h1,
        h3 {
            color: rgb(245, 134, 7);
        }

        .box {
            background: rgb(170, 14, 14);
            color: rgb(62, 4, 87);
        }
    </style>
</head>

<body>
    <div class="container py-4">

        <h1 class="mb-1">My Daily Task Organizer</h1>
        <p class="text-muted mb-4">Sort and label your daily tasks using JavaScript array methods!</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Daily Tasks</h3>

                <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>

                <div id="taskResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Task Time</h3>

                <button class="btn btn-primary mr-2" onclick="sortShortest()">Earliest First</button>
                <button class="btn btn-primary" onclick="sortLongest()">Latest First</button>

                <div id="timeResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Task Time</h3>

                <button class="btn btn-primary" onclick="addLabel()">Add Time Label</button>

                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

    </div>

    <script>
        var tasks = ["School", "Football", "Coding"];
        var minutes = [830, 1500, 1700];

        document.getElementById("taskResult").innerHTML =
            "Tasks: " + tasks;

        document.getElementById("timeResult").innerHTML =
            "Times: 8:30 AM, 3:00 PM, 5:00 PM";

        document.getElementById("labelResult").innerHTML =
            "Press the button above!";

        function sortAZ() {
            tasks.sort();
            document.getElementById("taskResult").innerHTML = "A to Z: " + tasks;
        }

        function sortZA() {
            tasks.sort();
            tasks.reverse();
            document.getElementById("taskResult").innerHTML = "Z to A: " + tasks;
        }

        function sortShortest() {
            minutes.sort(function (a, b) { return a - b; });
            document.getElementById("timeResult").innerHTML =
                "Earliest first: 8:30 AM, 3:00 PM, 5:00 PM";
        }

        function sortLongest() {
            minutes.sort(function (a, b) { return b - a; });
            document.getElementById("timeResult").innerHTML =
                "Latest first: 5:00 PM, 3:00 PM, 8:30 AM";
        }

        function addLabel() {
            var labelledMinutes = minutes.map(function (time) {
                return time + " time";
            });

            document.getElementById("labelResult").innerHTML =
                "Labelled times: " + labelledMinutes;
        }
    </script>

</body>

</html>
